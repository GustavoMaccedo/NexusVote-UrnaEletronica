[package]
name = "nv-secure-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Núcleo de segurança AAA+ do NexusVote Lab: journal selado, hash-chain, PIN Argon2, nonce persistente. PROTÓTIPO DE LABORATÓRIO."
rust-version = "1.85"

[lib]
name = "nv_secure_core"
crate-type = ["rlib"]

[dependencies]
sha2 = "0.11"
ed25519-dalek = { version = "3.0", features = ["zeroize", "rand_core", "serde"] }
aes-gcm = { version = "0.11", features = ["getrandom"] }
chacha20poly1305 = "0.11"
argon2 = "0.6"
password-hash = { version = "0.6", features = ["phc"] }
zeroize = { version = "1.9", features = ["derive"] }
secrecy = "0.10"
subtle = "2.6"
getrandom = "0.4"
rand_core = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
itoa = "1.0"
ryu = "1.0"
thiserror = "2.0"

[dev-dependencies]
proptest = "1.12"
hex-literal = "0.4"
